<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kaitech Light Looks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Michroma&display=swap">
<style>
/* Layout: one fixed frame, no scroll. A single object made of points holds the centre: first the Kaitech mark, then one form per product. Everything else sits on the frame's edges like instrument markings. */
:root{
  /* Three light looks, all from the Kaitech logo: navy #14295A and blue #2563CC. Look 1, Blueprint, is the default. */
  --bg0:#E9EDF4; --bg1:#FFFFFF; --fg:#14295A; --dim:#5C6A89; --line:#C5CEDF; --accent:#2563CC; --on-accent:#FFFFFF;
  --cool:#2563CC; --mid:#2D4F9C; --warm:#14295A;
  --blend:source-over; --ox:.68; --oy:.42; --os:1; --hi:1; --lo:.82;
  --display:'Michroma','Eurostile','Arial Black',sans-serif;
  --text:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
/* Look 2, Showroom: silver studio light, quiet sans type, everything on the centre line */
:root[data-look="b"]{--bg0:#D9DEE7; --bg1:#FFFFFF; --fg:#0D1730; --dim:#5B6478; --line:#BFC6D3; --mid:#22386F; --warm:#0D1730;
  --display:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif; --ox:.5; --oy:.37; --os:.66}
/* Look 3, Blue: the logo's blue as the whole room, white points, navy for what matters */
:root[data-look="c"]{--bg0:#1C4FB0; --bg1:#3273E4; --fg:#FFFFFF; --dim:#CADAF8; --line:#6C97E8; --accent:#0B1A40;
  --cool:#0B1A40; --mid:#A9C3F4; --warm:#FFFFFF; --ox:.33; --os:.86; --hi:1; --lo:.9}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg0);color:var(--fg);font-family:var(--text);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
.k{position:relative;height:100%;min-height:520px;overflow:hidden;
  background:radial-gradient(110% 85% at 62% 42%,var(--bg1) 0%,var(--bg0) 64%);
  padding-block:22px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;gap:16px 24px}
#fx{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#fx:active{cursor:grabbing}
.k>*:not(#fx){position:relative;pointer-events:none}
.k a,.k button{pointer-events:auto}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:1px solid var(--fg);outline-offset:4px}

.mark{grid-column:1/3;grid-row:1;align-self:start;justify-self:start;display:flex;align-items:center;gap:12px;font:400 14px/1 var(--display);letter-spacing:.42em}
.mark svg{width:26px;height:26px;flex:none}
.mark .bar{fill:var(--fg)} .mark .bar.b{fill:var(--accent)}
:root[data-look="c"] .mark .bar{fill:var(--accent)} :root[data-look="c"] .mark .bar.b{fill:var(--fg)}
.read{grid-column:3;grid-row:1;display:grid;grid-template-columns:auto auto;gap:4px 14px;font:400 11px/1.2 var(--mono);color:var(--dim);
  font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.06em;text-align:right;justify-self:end}
.read b{font-weight:400;color:var(--fg)}

.idx{grid-column:1;grid-row:2;align-self:center;display:flex;flex-direction:column;gap:2px;font:400 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em}
.idx a{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--dim);transition:color .3s}
.idx a::before{content:"";width:14px;height:1px;background:currentColor;transition:width .45s cubic-bezier(.2,.7,.1,1)}
.idx a:hover{color:var(--fg)}
.idx a[aria-current="true"]{color:var(--fg)}
.idx a[aria-current="true"]::before{width:44px;background:var(--accent)}
.idx kbd{font:inherit;color:var(--dim)}

.panel{grid-column:1/3;grid-row:3;align-self:end;max-width:min(40rem,46vw);display:flex;flex-direction:column;gap:14px;transition:opacity .35s,transform .5s cubic-bezier(.2,.7,.1,1)}
.panel.out{opacity:0;transform:translateY(10px)}
.tag{margin:0;font:400 11px/1 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.14em}
.panel h1{margin:0;font:400 clamp(27px,4.6vw,64px)/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase}
.panel p.body{margin:0;max-width:34rem;font-size:clamp(15px,1.25vw,18px);color:var(--dim);text-wrap:pretty}
.slots{list-style:none;margin:4px 0 0;padding:0;max-width:34rem;border-top:1px solid var(--line);font:400 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em}
.slots li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.slots span:last-child{color:var(--dim);text-align:right}

.hint{grid-column:3;grid-row:3;align-self:end;justify-self:end;text-align:right;font:400 11px/1.6 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.hint b{display:block;font:400 clamp(22px,2.6vw,36px)/1 var(--display);color:var(--fg);letter-spacing:.04em;margin-bottom:10px;font-variant-numeric:tabular-nums}
.hint b i{font-style:normal;color:var(--dim)}
.hint b span{color:var(--accent)}

@media (max-width:720px){
  .k{grid-template-columns:minmax(0,1fr) auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mark{grid-column:1} .read{grid-column:2}
  .read .wide{display:none}
  .idx{grid-column:1/3;grid-row:3;flex-direction:row;gap:0;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px}
  .idx a{padding:12px 4px;gap:8px} .idx a::before{display:none}
  .idx a span{display:none} .idx a[aria-current="true"] span{display:inline} .idx a[aria-current="true"] kbd{color:var(--accent)}
  .panel{grid-column:1/3;grid-row:2;max-width:none}
  .hint{display:none}
}

/* Blueprint: drawing-sheet grid behind the object */
.k::before{content:"";position:absolute;inset:0;opacity:.4;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(70% 70% at 66% 42%,#000 0%,transparent 75%);mask-image:radial-gradient(70% 70% at 66% 42%,#000 0%,transparent 75%)}
:root[data-look="b"] .k::before,:root[data-look="c"] .k::before{display:none}
.panel p.body,.slots{max-width:min(34rem,36vw)}
:root[data-look="b"] .panel h1{text-transform:none;font-weight:500;letter-spacing:-.04em}
:root[data-look="c"] .hint b span{color:var(--fg)} :root[data-look="c"] .hint b i{color:var(--accent)}

@media (min-width:961px){
  :root[data-look="b"] .idx{grid-column:1/4;grid-row:1;align-self:start;justify-self:center;flex-direction:row;gap:26px}
  :root[data-look="b"] .idx a{padding:4px 0 8px;border-bottom:1px solid transparent}
  :root[data-look="b"] .idx a::before,:root[data-look="b"] .idx kbd{display:none}
  :root[data-look="b"] .idx a[aria-current="true"]{border-color:var(--accent)}
  :root[data-look="b"] .panel{grid-column:1/4;justify-self:center;align-items:center;text-align:center;max-width:52rem;padding-bottom:58px}
  :root[data-look="b"] .panel h1{font-size:clamp(44px,6.4vw,96px)}
  :root[data-look="b"] .panel p.body{max-width:38rem}
  :root[data-look="b"] .slots{display:flex;gap:36px;border:0;max-width:none}
  :root[data-look="b"] .slots li{flex-direction:column;align-items:center;gap:6px;border:0;padding:0}
  :root[data-look="b"] .hint{display:none}
}
@media (min-width:721px){
  :root[data-look="c"] .idx{grid-column:3;justify-self:end;align-items:flex-end}
  :root[data-look="c"] .idx a{flex-direction:row-reverse}
  :root[data-look="c"] .panel{grid-column:2/4;justify-self:end;align-items:flex-end;text-align:right}
  :root[data-look="c"] .slots{width:100%}
  :root[data-look="c"] .hint{grid-column:1;justify-self:start;text-align:left}
  :root[data-look="c"] .read{grid-column:2/4}
}
@media (max-width:720px){.panel p.body,.slots{max-width:none}}

.pick{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;justify-content:center;pointer-events:none}
.pick div{pointer-events:auto;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--fg);font:400 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em}
.pick button{border:0;background:transparent;color:var(--bg0);padding:9px 14px;border-radius:999px;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;white-space:nowrap}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
:root[data-look="c"] .pick button[aria-pressed="true"]{color:var(--fg)}
@media (max-width:720px){.pick{bottom:auto;top:calc(54px + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="k">
  <canvas id="fx" aria-hidden="true"></canvas>

  <a class="mark" href="#home" aria-label="Kaitech">
    <svg viewBox="0 0 26 26" aria-hidden="true"><rect class="bar" x="0" y="1" width="26" height="6" rx="3"/><rect class="bar b" x="6.5" y="10" width="13" height="6" rx="3"/><rect class="bar" x="0" y="19" width="26" height="6" rx="3"/></svg>
    KAITECH
  </a>

  <div class="read" aria-hidden="true">
    <span>Yaw</span><b id="r-yaw">+000.0°</b>
    <span>Pitch</span><b id="r-pit">+000.0°</b>
    <span class="wide">Points</span><b class="wide" id="r-pts">0</b>
    <span class="wide">Local</span><b class="wide" id="r-time">00:00:00</b>
  </div>

  <nav class="idx" aria-label="Sections">
    <a href="#home"><kbd>1</kbd><span>Kaitech</span></a>
    <a href="#workforce"><kbd>2</kbd><span>KaiWorkforce</span></a>
    <a href="#billzilla"><kbd>3</kbd><span>BillZilla</span></a>
    <a href="#inspect"><kbd>4</kbd><span>KaiInspect</span></a>
    <a href="#drivo"><kbd>5</kbd><span>Drivo</span></a>
    <a href="#contact"><kbd>6</kbd><span>Contact</span></a>
  </nav>

  <section class="panel" id="panel" aria-live="polite">
    <p class="tag" id="p-tag"></p>
    <h1 id="p-title"></h1>
    <p class="body" id="p-body"></p>
    <ul class="slots" id="p-slots" hidden></ul>
  </section>

  <div class="hint" aria-hidden="true">
    <b><span id="h-n">01</span><i> / 06</i></b>
    Drag to turn<br>Scroll or ↑ ↓ to move on
  </div>
</div>

<nav class="pick" aria-label="Looks"><div>
  <button type="button" data-look="a" aria-pressed="true">1 Blueprint</button>
  <button type="button" data-look="b" aria-pressed="false">2 Showroom</button>
  <button type="button" data-look="c" aria-pressed="false">3 Blue</button>
</div></nav>

<script>
(() => {
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = $('fx'), ctx = cv.getContext('2d');
const N = Math.min(innerWidth, innerHeight) < 600 ? 4500 : 8000;
const NB = N * 0.8 | 0;            // points 0..NB are the white ones; NB..N are the blue ones, used for the part of each form that matters

const MODES = [
  { id: 'home', tag: 'The company', title: 'Kaitech',
    body: 'Software for the way Fiji businesses run: paying people, sending invoices, checking the work and getting deliveries out. Four products, each one useful on its own.' },
  { id: 'workforce', tag: 'Product 1 of 4 · payroll and HR', title: 'KaiWorkforce',
    body: 'Payroll and HR for staffing agencies. FNPF and PAYE are worked out for you, staff clock in at their work site, and payslips go out by email.',
    slots: [['Payroll', 'FNPF · PAYE · payslips'], ['Attendance', 'Clock-in by work site'], ['People', 'Leave · timesheets · org chart']] },
  { id: 'billzilla', tag: 'Product 2 of 4 · invoicing', title: 'BillZilla',
    body: 'Invoicing for Fiji businesses. Quotes become invoices with gap-free numbers, stock moves when you finalise, and customers get statements and reminders.',
    slots: [['Documents', 'Quotes · invoices · credit notes'], ['Payments', 'Bank · cash · M-PAiSA · MyCash'], ['Currency', 'FJD or the customer’s own']] },
  { id: 'inspect', tag: 'Product 3 of 4 · quality control', title: 'KaiInspect',
    body: 'Cleaning quality control for facility services companies. An auditor marks each room Pass or Fail, every Fail needs a photo, and the cleaner sends back a photo of the fix.',
    slots: [['Inspect', 'Saves with no signal'], ['Fix', 'WhatsApp link, no account'], ['Report', 'Customer and internal']] },
  { id: 'drivo', tag: 'Product 4 of 4 · delivery', title: 'Drivo',
    body: 'Delivery routing and fleet tracking for distribution companies. Dispatchers plan routes from confirmed invoices, drivers navigate in the app, and every vehicle shows live.',
    slots: [['Routes', 'From confirmed invoices'], ['Drivers', 'Navigation · proof of delivery'], ['Works with', 'BillZilla · KaiWorkforce']] },
  { id: 'contact', tag: 'Get in touch', title: 'Contact',
    body: 'Tell us what your business runs on today.',
    slots: [['Email', 'To be added'], ['Phone', 'To be added']] },
];

/* ── forms: every one is the same N points, rearranged ── */
const rnd = (a = 1) => (Math.random() - 0.5) * 2 * a, TAU = 6.2832;
const make = fill => { const o = new Float32Array(N * 3); for (let i = 0; i < N; i++) { const p = fill(i, i >= NB); o[i * 3] = p[0]; o[i * 3 + 1] = p[1]; o[i * 3 + 2] = p[2] || 0; } return o; };
const seg = (ax, ay, az, bx, by, bz, j = 0.02) => { const t = Math.random(); return [ax + (bx - ax) * t + rnd(j), ay + (by - ay) * t + rnd(j), az + (bz - az) * t + rnd(j)]; };
const ring = (r, j = 0.025) => { const a = Math.random() * TAU; return [Math.cos(a) * r + rnd(j), Math.sin(a) * r + rnd(j), rnd(j)]; };
const pill = (half, y, r) => { // a rounded bar: the logo's shape
  const a = Math.random() * TAU, u = rnd(1), s = Math.sqrt(1 - u * u), d = r * (0.72 + 0.28 * Math.random());
  return [rnd(half - r) + Math.cos(a) * s * d, y + Math.sin(a) * s * d, u * d];
};
const shapes = [
  // the Kaitech mark: two long bars, one short blue bar between them
  make((i, blue) => blue ? pill(0.66, 0, 0.3) : pill(1.32, i % 2 ? -0.92 : 0.92, 0.3)),
  // KaiWorkforce: a clock face at ten past ten
  make((i, blue) => {
    if (blue) return i % 5 < 2 ? seg(0, 0, 0, -0.52, -0.3, 0, 0.03) : seg(0, 0, 0, 0.8, -0.47, 0, 0.025);
    if (i % 5 < 3) return ring(1.3);
    const h = (Math.random() * 12 | 0) / 12 * TAU, c = Math.cos(h), s = Math.sin(h), big = Math.round(h / TAU * 12) % 3 === 0;
    return seg(c * (big ? 0.92 : 1.05), s * (big ? 0.92 : 1.05), 0, c * 1.17, s * 1.17, 0, 0.018);
  }),
  // BillZilla: three sheets, the front one with a header and a total
  make((i, blue) => {
    if (blue) return i % 3 ? seg(0.1, 0.72, -0.4, 0.62, 0.72, -0.4, 0.035) : seg(-0.62, -0.78, -0.4, -0.2, -0.78, -0.4, 0.035);
    const k = i % 3, z = -0.4 + k * 0.4, ox = k * 0.16, oy = -k * 0.13, w = 0.8, h = 1.05, e = Math.random() * 4 | 0;
    if (i % 5 < 3) return e === 0 ? seg(ox - w, oy - h, z, ox + w, oy - h, z, 0.008) : e === 1 ? seg(ox - w, oy + h, z, ox + w, oy + h, z, 0.008)
      : e === 2 ? seg(ox - w, oy - h, z, ox - w, oy + h, z, 0.008) : seg(ox + w, oy - h, z, ox + w, oy + h, z, 0.008);
    const row = -0.42 + (Math.random() * 5 | 0) * 0.21;
    return seg(ox - 0.62, oy + row, z, ox + 0.62, oy + row, z, 0.008);
  }),
  // KaiInspect: a pass mark inside its ring
  make((i, blue) => blue ? (i % 3 ? seg(-0.2, 0.48, 0, 0.7, -0.5, 0, 0.06) : seg(-0.66, 0.02, 0, -0.2, 0.48, 0, 0.06)) : ring(1.3, 0.04)),
  // Drivo: a route with four stops over a street grid
  (() => {
    const path = t => [-1.4 + 2.8 * t, 0.45, 0.85 * Math.sin(t * 5.4) * (0.4 + 0.6 * t)], stops = [0.04, 0.33, 0.66, 0.96];
    return make((i, blue) => {
      if (!blue) { const l = ((Math.random() * 7 | 0) - 3) * 0.48; return Math.random() < 0.5 ? seg(l, 0.47, -1.44, l, 0.47, 1.44, 0.006) : seg(-1.44, 0.47, l, 1.44, 0.47, l, 0.006); }
      if (i % 5 < 3) { const p = path(Math.random()); return [p[0] + rnd(0.02), p[1] + rnd(0.02), p[2] + rnd(0.02)]; }
      const p = path(stops[Math.random() * 4 | 0]);
      if (Math.random() < 0.4) return seg(p[0], 0.45, p[2], p[0], -0.2, p[2], 0.012);
      const a = Math.random() * TAU, u = rnd(1), s = Math.sqrt(1 - u * u);
      return [p[0] + Math.cos(a) * s * 0.13, -0.3 + u * 0.13, p[2] + Math.sin(a) * s * 0.13];
    });
  })(),
  // Contact: a globe with one orbit
  make((i, blue) => {
    if (blue) { const a = Math.random() * TAU, r = 1.55 + rnd(0.06), x = Math.cos(a) * r; return [x, x * 0.32 + rnd(0.012), Math.sin(a) * r]; }
    const y = 1 - 2 * (i + 0.5) / NB, r = Math.sqrt(1 - y * y), a = i * 2.39996323;
    return [Math.cos(a) * r * 1.1, y * 1.1, Math.sin(a) * r * 1.1];
  }),
];

/* colour: blue points take the logo's blue, the rest run from pale blue to white */
const pos = new Float32Array(shapes[0]), ease = new Float32Array(N), order = new Uint32Array(N);
const BUCKETS = 9, palette = [], bucket = new Uint8Array(N);
{
  const cs = getComputedStyle(document.documentElement), hex = n => { const h = cs.getPropertyValue(n).trim().slice(1); return [0, 2, 4].map(k => parseInt(h.substr(k, 2), 16)); };
  const a = hex('--cool'), w = hex('--mid'), b = hex('--warm');
  for (let k = 0; k < BUCKETS; k++) {
    const t = k / (BUCKETS - 1), u = t < 0.5 ? t * 2 : (t - 0.5) * 2, p = t < 0.5 ? a : w, q = t < 0.5 ? w : b;
    palette.push(`rgb(${p.map((v, j) => Math.round(v + (q[j] - v) * u)).join(',')})`);
  }
  for (let i = 0; i < N; i++) { bucket[i] = i >= NB ? Math.random() * 3 | 0 : 5 + (Math.random() * 4 | 0); ease[i] = 0.035 + Math.random() * 0.075; order[i] = i; }
  order.sort((p, q) => bucket[p] - bucket[q]);
}
/* looks: each one re-reads its colours and where the object sits from the CSS tokens */
let OS = 1, OX = 0.68, OY = 0.42, BLEND = 'source-over', HI = 1, LO = 0.82;
const looks = [...document.querySelectorAll('.pick button')];
function applyLook(name) {
  const root = document.documentElement; root.dataset.look = name;
  const cs = getComputedStyle(root), get = n => cs.getPropertyValue(n).trim(), hex = n => { const h = get(n).slice(1); return [0, 2, 4].map(k => parseInt(h.substr(k, 2), 16)); };
  const a = hex('--cool'), w = hex('--mid'), b = hex('--warm');
  for (let k = 0; k < BUCKETS; k++) {
    const t = k / (BUCKETS - 1), u = t < 0.5 ? t * 2 : (t - 0.5) * 2, p = t < 0.5 ? a : w, q = t < 0.5 ? w : b;
    palette[k] = `rgb(${p.map((v, j) => Math.round(v + (q[j] - v) * u)).join(',')})`;
  }
  OS = +get('--os'); OX = +get('--ox'); OY = +get('--oy'); BLEND = get('--blend'); HI = +get('--hi'); LO = +get('--lo');
  looks.forEach(bt => bt.setAttribute('aria-pressed', bt.dataset.look === name));
  try { localStorage.setItem('kaitech-look', name); } catch (e) {}
}
looks.forEach(bt => bt.addEventListener('click', () => applyLook(bt.dataset.look)));
{ let saved = 'a'; try { saved = localStorage.getItem('kaitech-look') || 'a'; } catch (e) {} applyLook(/^[abc]$/.test(saved) ? saved : 'a'); }

/* ── view ── */
let W = 0, H = 0, dpr = 1, mode = 0, yaw = 0, pitch = 0, uy = 0, up = 0, vy = 0, vp = 0, px = 0, py = 0, spin = 0, drag = null, readTick = 0;
function resize() { dpr = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; }
new ResizeObserver(resize).observe(cv); resize();

function frame(now) {
  const t = now / 1000, target = shapes[mode], narrow = W < 720, globe = mode === 5, ground = mode === 4;
  if (!drag) { uy += vy; up += vp; vy *= 0.94; vp *= 0.94; uy *= 0.985; up *= 0.97; }
  if (globe && !reduced) spin += 0.0032; else spin *= 0.94;
  const sway = reduced || globe ? 0 : Math.sin(t * 0.42) * (ground ? 0.5 : 0.4);

<title>KaiTech Next</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Michroma&display=swap">
<style>
/* Layout: the hyper one-page site plus three personal, local touches: a "what is slowing you down" picker, your business name in points, and the real time in Suva driving the clock and the light. Built on the hyper version: Scrolling scrubs the point object between forms, everything reacts to the pointer, and each product leads with a one-line hook. Built on the one-page layout: Content scrolls freely on the left; the point object is pinned on the right and changes form for the section in view. On phones it sits faint behind the text. */
:root{
  --bg0:#030712; --bg1:#14295A; --fg:#F5F6F9; --dim:#9AA4BA; --line:#243049; --accent:#4C8DF5;
  --cool:#2563CC; --mid:#6FA0F2; --warm:#F5F6F9; --scrim:rgba(3,7,18,.72);
  --brand:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Michroma','Eurostile','Arial Black',sans-serif;
  --text:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg0);color:var(--fg);font:17px/1.6 var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:1px solid var(--fg);outline-offset:4px}
.wrap{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg0)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:16px;
  background:linear-gradient(var(--bg0) 55%,transparent)}
.mark{display:flex;align-items:center;gap:11px;font:500 21px/1 var(--brand);letter-spacing:-.01em;text-decoration:none}
.mark svg{width:26px;height:26px}
.wm .t{color:var(--accent)}
.bar nav{display:flex;gap:clamp(14px,2.2vw,28px);font:400 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em}
.bar nav a{text-decoration:none;color:var(--dim);padding:8px 0;border-bottom:1px solid transparent;transition:color .25s,border-color .25s}
.bar nav a:hover{color:var(--fg)} .bar nav a.on{color:var(--fg);border-color:var(--accent)}
.bar .cta{padding:10px 16px}

/* the pinned object */
.stage{position:fixed;top:0;right:0;width:50vw;height:100vh;height:100dvh;pointer-events:none;
  background:radial-gradient(70% 60% at 55% 50%,var(--bg1) 0%,transparent 70%)}
canvas{width:100%;height:100%;display:block}

/* sections */
main{position:relative;z-index:1}
section{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:96px;max-width:min(36rem,46vw)}
.tag{margin:0;font:400 11px/1.4 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.14em}
h1,h2{margin:0;font:400 clamp(30px,4.4vw,62px)/1.06 var(--display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
#about h2{font-size:clamp(28px,3.4vw,48px)}
h1.brand{font:500 clamp(54px,8vw,120px)/.95 var(--brand);letter-spacing:-.03em;text-transform:none}
.hook{display:none}
h3{margin:22px 0 4px;font:500 19px/1.3 var(--text)}
p{margin:0;color:var(--dim);text-wrap:pretty}
.lead{font-size:clamp(18px,1.6vw,22px);line-height:1.5;color:var(--fg)}
dl{margin:6px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);font:400 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em}
dt,dd{margin:0;padding:11px 0;border-top:1px solid var(--line)} dt{padding-right:20px} dd{text-align:right;color:var(--dim)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cta{display:inline-flex;align-items:center;padding:13px 22px;border-radius:999px;background:var(--accent);color:var(--bg0);border:1px solid var(--accent);text-decoration:none;
  font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;cursor:pointer;transition:background-color .25s,border-color .25s,transform .1s ease-out}
.cta:hover{background:var(--fg);border-color:var(--fg)} .cta:active{transform:scale(.97)}
.cta.ghost{background:transparent;color:var(--fg);border-color:var(--line)} .cta.ghost:hover{border-color:var(--fg)}
.shots{display:grid;gap:14px;margin-top:10px}
.shots.phone{grid-template-columns:1fr 1fr}
.shots figure{margin:0;background:var(--bg1);border-radius:14px;padding:10px}
.shots img{display:block;width:100%;height:auto;border-radius:8px}
.shots figcaption{margin-top:8px;font-size:13px;color:var(--dim)}
.clients{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-top:6px}
.clients img{height:20px;width:auto}
.clients .tp{display:inline-flex;align-items:center;gap:9px;font:400 12px/1 var(--display);letter-spacing:.14em}
.clients .tp svg{width:18px;height:18px}
.founder{display:flex;align-items:center;gap:16px}
.founder img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.founder b{display:block;font:500 17px/1.3 var(--text)} .founder span{font:400 11px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
.scrollcue{display:flex;align-items:center;gap:10px;margin-top:18px;font:400 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
.scrollcue i{width:1px;height:34px;background:linear-gradient(var(--accent),transparent);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleY(.4);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}

/* form */
form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
label{display:flex;flex-direction:column;gap:6px;min-width:0;font:400 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
label.wide{grid-column:1/-1}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:rgba(3,7,18,.7);color:var(--fg);font:400 16px/1.3 var(--text);letter-spacing:0;text-transform:none}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.hp{position:absolute;left:-9999px}
.note{grid-column:1/-1;margin:0;font-size:15px} .note.err{color:#FF9A8A} .note.ok{color:var(--fg)}
footer{position:relative;z-index:1;display:flex;gap:8px 22px;flex-wrap:wrap;padding-block:22px 40px;border-top:1px solid var(--line);font:400 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
footer a{text-decoration:none} footer a:hover{color:var(--fg)}

/* reveal as sections come into view: visible by default, only animated once the script runs */
.js .rv{opacity:0;transform:translateY(14px);transition:opacity .5s cubic-bezier(.2,.7,.1,1),transform .6s cubic-bezier(.2,.7,.1,1)}
.js .in .rv{opacity:1;transform:none}

@media (max-width:860px){
  .stage{width:100vw;opacity:.32}
  section{max-width:none;min-height:auto;padding-block:72px}
  section:first-of-type{min-height:88vh;min-height:88dvh}
  .bar nav{display:none}
  form{grid-template-columns:1fr}
}

/* ── hyper extras ── */
.hook{display:block;margin:0;font:600 clamp(26px,3.2vw,44px)/1.08 var(--brand);letter-spacing:-.025em;color:var(--fg);text-wrap:balance}
section h2{font-size:clamp(14px,1.2vw,16px);font-family:var(--mono);letter-spacing:.16em;color:var(--accent)}
#top h1.brand{font-size:clamp(64px,11vw,170px)}
#about h2{font:400 clamp(28px,3.4vw,48px)/1.06 var(--display);color:var(--fg);letter-spacing:.02em;}
#contact h2{font:400 clamp(30px,4.4vw,62px)/1.06 var(--display);color:var(--fg);letter-spacing:.02em;}
.prog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:11;background:rgba(76,141,245,.15)}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.prog b{position:absolute;top:-2px;width:1px;height:7px;background:var(--dim)}
.snd{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:9px 12px;font:400 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform .1s ease-out,color .2s,border-color .2s}
.snd:hover{color:var(--fg);border-color:var(--fg)} .snd:active{transform:scale(.97)} .snd[aria-pressed="true"]{color:var(--fg);border-color:var(--accent)}
.bar .right{display:flex;gap:10px;align-items:center}
.hint{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:2;font:400 11px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--dim);text-align:right;pointer-events:none;transition:opacity .4s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:8px 12px;border:1px solid var(--line);border-radius:999px;font:400 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--fg);background:rgba(3,7,18,.6)}
.js .chips span{opacity:0;transform:translateY(8px) scale(.96);transition:opacity .35s cubic-bezier(.2,.7,.1,1),transform .4s cubic-bezier(.2,.7,.1,1)}
.js .in .chips span{opacity:1;transform:none}
main{will-change:transform}
.bar .cta,.snd{white-space:nowrap}
@media (max-width:860px){ .hint{display:none} .snd{padding:8px 10px} }
@media (max-width:460px){ .snd{display:none} .bar .cta{padding:10px 13px} }

/* ── next: picker, your name, Fiji time ── */
:root{--glow:#14295A}
.stage{background:radial-gradient(70% 60% at 55% 50%,var(--glow) 0%,transparent 70%);transition:background 2s}
.pick{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.pick p{font:400 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:0}
.pick div{display:flex;flex-wrap:wrap;gap:8px}
.pick button{font:500 15px/1 var(--text);color:var(--fg);background:rgba(3,7,18,.6);border:1px solid var(--line);border-radius:999px;padding:12px 16px;cursor:pointer;
  transition:border-color .2s,background-color .2s,transform .1s ease-out}
.pick button:hover{border-color:var(--accent)} .pick button:active{transform:scale(.97)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg0)}
.yours{display:flex;flex-direction:column;gap:8px;margin-top:4px;max-width:26rem}
.yours label{font:400 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}
.yours input{font:500 18px/1.2 var(--brand);letter-spacing:-.01em;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(3,7,18,.7);color:var(--fg);text-transform:none}
.yours input:focus{outline:none;border-color:var(--accent)}
.suva{font:400 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.suva b{font-weight:400;color:var(--fg)}
.now{margin:0;font:400 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:12;opacity:0;pointer-events:none;
  padding:10px 16px;border-radius:999px;background:var(--fg);color:var(--bg0);font:500 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;transition:opacity .25s,transform .3s cubic-bezier(.2,.7,.1,1)}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:1100px){ .suva{display:none} }
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
</style>

<div class="prog" aria-hidden="true"><i></i></div>
<div class="stage" aria-hidden="true"><canvas id="fx"></canvas></div>

<header class="bar wrap">
  <a class="mark" href="#top" aria-label="KaiTech"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="0" y="1" width="26" height="6" rx="3" fill="#F5F6F9"/><rect x="6.5" y="10" width="13" height="6" rx="3" fill="#4C8DF5"/><rect x="0" y="19" width="26" height="6" rx="3" fill="#F5F6F9"/></svg><span class="wm"><span>Kai</span><span class="t">Tech</span></span></a>
  <nav aria-label="Sections"><!--NAV--></nav>
  <div class="right"><span class="suva" id="suva" aria-live="off"></span><button class="snd" type="button" aria-pressed="false" id="snd">Sound off</button><a class="cta" href="#contact">Book a demo</a></div>
</header>

<script>
(() => {
document.documentElement.classList.add('js');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LOW = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 3 || !!(navigator.connection && navigator.connection.saveData);
const N = innerWidth < 860 ? (LOW ? 2400 : 3600) : (LOW ? 4500 : 7000), NB = N * 0.8 | 0;
/*FORMS*/
const FORM = { top: 0, workforce: 1, billzilla: 2, inspect: 3, drivo: 4, about: 5, contact: 6 };

/* ── the real time in Suva: it sets the clock's hands and the colour of the light ── */
const fijiNow = () => { try { const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Pacific/Fiji', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date());
  return { h: +p.find(x => x.type === 'hour').value % 24, m: +p.find(x => x.type === 'minute').value }; } catch (e) { const d = new Date(); return { h: d.getHours(), m: d.getMinutes() }; } };
const handT = new Float32Array(N); for (let i = 0; i < N; i++) handT[i] = Math.random();
function setClock() {
  const { h, m } = fijiNow(), clock = shapes[1];
  const hourA = ((h % 12) + m / 60) / 12 * TAU, minA = m / 60 * TAU;
  for (let i = NB; i < N; i++) {   // the blue points are the hands: two in five on the hour hand, the rest on the minute hand
    const hour = i % 5 < 2, a = hour ? hourA : minA, len = hour ? 0.6 : 0.95, t = handT[i];
    clock[i * 3] = Math.sin(a) * len * t + rnd(0.028); clock[i * 3 + 1] = -Math.cos(a) * len * t + rnd(0.028); clock[i * 3 + 2] = rnd(0.028);
  }
  const part = h < 5 ? 'night' : h < 8 ? 'sunrise' : h < 17 ? 'day' : h < 19 ? 'sunset' : 'night';
  const glow = { night: '#0E1F4A', sunrise: '#5A3A2A', day: '#1D3F86', sunset: '#4A2A55' }[part];
  document.documentElement.style.setProperty('--glow', glow);
  const twelve = (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' am' : ' pm');
  document.getElementById('suva').innerHTML = 'Suva <b>' + twelve + '</b> · ' + part;
  const n = document.getElementById('wf-now'); if (n) n.textContent = 'Right now it is ' + twelve + ' in Suva. The hands above agree.';
}

/* ── words in points: your business name, or a hidden greeting ── */
function textShape(str) {
  const Wc = 900, Hc = 260, c = document.createElement('canvas'); c.width = Wc; c.height = Hc; const g = c.getContext('2d');
  let size = 180; g.font = `600 ${size}px Inter, system-ui, sans-serif`; let tw = g.measureText(str).width;
  if (tw > Wc - 40) { size *= (Wc - 40) / tw; g.font = `600 ${size}px Inter, system-ui, sans-serif`; tw = Wc - 40; }
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff'; g.fillText(str, Wc / 2, Hc / 2);
  const d = g.getImageData(0, 0, Wc, Hc).data, px = []; for (let y = 0; y < Hc; y += 2) for (let x = 0; x < Wc; x += 2) if (d[(y * Wc + x) * 4 + 3] > 120) px.push(x, y);
  const out = new Float32Array(N * 3), n = px.length / 2 || 1, k = 3.3 / Math.max(tw, 300);
  for (let i = 0; i < N; i++) { const j = (i * 7919 % n) * 2; out[i * 3] = ((px[j] || Wc / 2) - Wc / 2 + rnd(1)) * k; out[i * 3 + 1] = ((px[j + 1] || Hc / 2) - Hc / 2 + rnd(1)) * k; out[i * 3 + 2] = rnd(0.08); }
  return out;
}
// an override shows a shape on top of the scroll for a while, then hands back to the scroll
let ov = null;   // { shape, t0, until, back }
function showShape(shape, seconds) { ov = { shape, t0: performance.now() / 1000, until: seconds ? performance.now() / 1000 + seconds : Infinity, back: 0 }; from.set(pos); }
function release() { if (ov && !ov.back) { ov.back = performance.now() / 1000; from.set(pos); } }
let toastT = 0; function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2400); }

/* ── 1. what is slowing you down? ── */
const PICKS = [['Paying staff', 'workforce', 'KaiWorkforce'], ['Sending invoices', 'billzilla', 'BillZilla'], ['Checking cleaning', 'inspect', 'KaiInspect'], ['Getting deliveries out', 'drivo', 'Drivo']];
const hero = document.getElementById('top'), pick = document.createElement('div'); pick.className = 'pick rv';
pick.innerHTML = '<p>What is slowing your business down?</p><div>' + PICKS.map(([l, id]) => `<button type="button" data-go="${id}" aria-pressed="false">${l}</button>`).join('') + '</div>';
const yours = document.createElement('div'); yours.className = 'yours rv';
yours.innerHTML = '<label for="your-name">Or type your business name</label><input id="your-name" maxlength="22" autocomplete="organization" placeholder="Nadi Fresh Produce">';
hero.querySelector('.acts').after(pick, yours);
const wf = document.querySelector('#workforce .hook'); if (wf) { const n = document.createElement('p'); n.className = 'now rv'; n.id = 'wf-now'; wf.after(n); }

/* facts become chips that pop in one by one */
document.querySelectorAll('main section dl').forEach(dl => { if (dl.closest('#contact')) return;
  const c = document.createElement('div'); c.className = 'chips rv';
  [...dl.querySelectorAll('dd')].forEach(dd => dd.textContent.split(' · ').forEach(t => { const s = document.createElement('span'); s.textContent = t; c.appendChild(s); }));
  [...c.children].forEach((el, k) => el.style.transitionDelay = (80 + k * 45) + 'ms'); dl.replaceWith(c); });

/* ── sound: tiny synthesised blips, off until the visitor turns it on ── */
let ac = null, soundOn = false;
const sndBtn = document.getElementById('snd');
sndBtn.addEventListener('click', () => { soundOn = !soundOn; sndBtn.setAttribute('aria-pressed', soundOn); sndBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
  if (soundOn && !ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (soundOn) blip(880, 0.05); });
function blip(f, len = 0.06, type = 'sine', vol = 0.06) {
  if (!soundOn || !ac) return; const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + len);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len + 0.05); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + len + 0.06);
}
document.querySelectorAll('a,button').forEach(el => el.addEventListener('pointerenter', () => blip(1320, 0.025, 'triangle', 0.03)));

/* ── the object ── */
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
const pal = ['#2563CC', '#3D78DB', '#5A8EEA', '#6FA0F2', '#A9C6F6', '#D2E1FA', '#E8EFFB', '#F5F6F9'];
const col = new Uint8Array(N), lag = new Float32Array(N), bow = new Float32Array(N * 3), rnd3 = new Float32Array(N * 3);
const ox = new Float32Array(N), oy = new Float32Array(N);   // pointer push, per point, springs back
for (let i = 0; i < N; i++) { col[i] = i >= NB ? Math.random() * 3 | 0 : 4 + (Math.random() * 4 | 0); lag[i] = Math.random() * 0.22;
  const a = Math.random() * 6.2832, u = rnd(1), q = Math.sqrt(1 - u * u); bow[i * 3] = Math.cos(a) * q * 0.6; bow[i * 3 + 1] = u * 0.6; bow[i * 3 + 2] = (Math.sin(a) * q + (i % 2 ? 1 : -1)) * 0.7;
  const b = Math.random() * 6.2832, v = rnd(1), w = Math.sqrt(1 - v * v); rnd3[i * 3] = Math.cos(b) * w; rnd3[i * 3 + 1] = v; rnd3[i * 3 + 2] = Math.sin(b) * w; }
const order = [...Array(N).keys()].sort((a, b) => col[a] - col[b]);
const pos = new Float32Array(N * 3), from = new Float32Array(N * 3), dur = new Float32Array(N); for (let i = 0; i < N; i++) dur[i] = 0.7 + Math.random() * 0.5;
setClock(); setInterval(setClock, 20000);
const inOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
let W = 0, H = 0, dpr = 1, yaw = 0, pitch = 0, px = 0, py = 0, mx = -1e9, my = -1e9, burst = 0, vel = 0, lastY = scrollY, smooth = scrollY;
function resize() { dpr = Math.min(devicePixelRatio || 1, innerWidth < 860 || LOW ? 1.5 : 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; measure(); }
const secs = [...document.querySelectorAll('main > section')], navs = [...document.querySelectorAll('.bar nav a')];
let centres = [];
function measure() { centres = secs.map(s => s.offsetTop + s.offsetHeight / 2); const tot = document.documentElement.scrollHeight - innerHeight;
  const bar = document.querySelector('.prog'); bar.querySelectorAll('b').forEach(x => x.remove());
  secs.forEach(s => { const b = document.createElement('b'); b.style.left = Math.min(100, s.offsetTop / Math.max(1, tot) * 100) + '%'; bar.appendChild(b); }); }
new ResizeObserver(resize).observe(cv); resize(); addEventListener('load', measure);
addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; if (e.pointerType === 'mouse') { px = e.clientX / innerWidth - 0.5; py = e.clientY / innerHeight - 0.5; } }, { passive: true });
addEventListener('pointerleave', () => { mx = my = -1e9; });
// tap or click on empty space: scatter the points, they pull back together
addEventListener('pointerdown', e => { if (e.target.closest('a,button,input,select,textarea,label,form')) return; burst = 1; blip(220, 0.18, 'sawtooth', 0.05); document.getElementById('hint').style.opacity = 0; });

let lastSec = -1;
function frame(now) {
  const t = now / 1000;
  smooth += (scrollY - smooth) * (reduced ? 1 : 0.18);
  vel += ((scrollY - lastY) - vel) * 0.2; lastY = scrollY;
  // where are we between two sections? the scroll position chooses the blend
  const s = smooth + innerHeight * 0.5; let i = 0; while (i < centres.length - 1 && s >= centres[i + 1]) i++;
  const a = centres[i], b = centres[Math.min(i + 1, centres.length - 1)], u = b > a ? Math.min(1, Math.max(0, (s - a) / (b - a))) : 0;
  const A = shapes[FORM[secs[i].id]], B = shapes[FORM[secs[Math.min(i + 1, secs.length - 1)].id]];
  const sec = u > 0.5 ? Math.min(i + 1, secs.length - 1) : i;
  if (sec !== lastSec) { if (lastSec >= 0) blip(330 + sec * 70, 0.07, 'triangle', 0.05); lastSec = sec;
    navs.forEach(n => n.classList.toggle('on', n.getAttribute('href') === '#' + secs[sec].id)); }
  const formB = FORM[secs[Math.min(i + 1, secs.length - 1)].id], globeAt = (u > 0.5 ? formB : FORM[secs[i].id]) === 6, ground = (u > 0.5 ? formB : FORM[secs[i].id]) === 4;

  const globe = !ov && globeAt, ty = Math.sin(t * 0.42) * (reduced ? 0 : 0.35) * (ov && !ov.back ? 0.4 : 1) + px * 0.35 + (ov && !ov.back ? 0 : smooth / innerHeight * 0.3) + (globe ? t * 0.2 : 0);
  const tp = py * 0.22 + (ov && !ov.back ? 0 : ground ? 0.5 : globe ? -0.25 : 0);
  yaw += (ty - yaw) * 0.08; pitch += (tp - pitch) * 0.08;
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const scale = Math.min(W / 3.9, H / 4.2) * dpr, base = dpr * 1.45, cx = W * 0.5 * dpr, cyy = H * 0.5 * dpr;
  const r0 = cv.getBoundingClientRect(), pmx = (mx - r0.left) * dpr, pmy = (my - r0.top) * dpr, R = 110 * dpr;
  const jit = Math.min(0.25, Math.abs(vel) * 0.004);   // fast scrolling shakes the points loose
  burst *= reduced ? 0 : 0.93;
  if (ov && !ov.back && t > ov.until) release();
  if (ov && ov.back && t - ov.back > 1.6) ov = null;

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.globalCompositeOperation = 'lighter';
  let last = -1;
  for (const k of order) {
    const j = k * 3, p = reduced ? (u > 0.5 ? 1 : 0) : inOut(Math.min(1, Math.max(0, (u - 0.1 - lag[k] * 2.6) / 0.24)))   /* staggered: half way, some points have arrived and some have not left */;
    const dx = B[j] - A[j], dy = B[j + 1] - A[j + 1], dz = B[j + 2] - A[j + 2];
    const arc = Math.sin(Math.PI * p) * Math.sqrt(dx * dx + dy * dy + dz * dz) * 0.18, e = burst * (0.8 + lag[k] * 4) + jit;
    let x = A[j] + dx * p + bow[j] * arc, y = A[j + 1] + dy * p + bow[j + 1] * arc, z = A[j + 2] + dz * p + bow[j + 2] * arc;
    if (ov) {   // an override: travel to its shape, and later travel back to where the scroll says
      const tgt = ov.back ? null : ov.shape, q = reduced ? 1 : inOut(Math.min(1, Math.max(0, (t - (ov.back || ov.t0) - lag[k]) / dur[k])));
      const ex = tgt ? tgt[j] : x, ey = tgt ? tgt[j + 1] : y, ez = tgt ? tgt[j + 2] : z, ax = from[j], ay = from[j + 1], az = from[j + 2];
      const bend = Math.sin(Math.PI * q) * 0.25 * Math.hypot(ex - ax, ey - ay, ez - az);
      x = ax + (ex - ax) * q + bow[j] * bend; y = ay + (ey - ay) * q + bow[j + 1] * bend; z = az + (ez - az) * q + bow[j + 2] * bend;
    }
    pos[j] = x; pos[j + 1] = y; pos[j + 2] = z;
    x += rnd3[j] * e; y += rnd3[j + 1] * e; z += rnd3[j + 2] * e;
    const x1 = x * cy + z * sy, z1 = -x * sy + z * cy, y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp, f = 4 / (4 + z2); if (f <= 0) continue;
    let X = cx + x1 * scale * f, Y = cyy + y1 * scale * f;
    // the pointer pushes points out of its way
    const ddx = X + ox[k] - pmx, ddy = Y + oy[k] - pmy, d2 = ddx * ddx + ddy * ddy; let tx = 0, tyy = 0;
    if (d2 < R * R && !reduced) { const d = Math.sqrt(d2) + 0.01, push = (1 - d / R) * 46 * dpr; tx = ddx / d * push; tyy = ddy / d * push; }
    ox[k] += (tx - ox[k]) * 0.2; oy[k] += (tyy - oy[k]) * 0.2; X += ox[k]; Y += oy[k];
    if (col[k] !== last) { last = col[k]; ctx.fillStyle = pal[last]; }
    ctx.globalAlpha = Math.max(0.14, Math.min(1, (k >= NB ? 0.95 : 0.6) - z2 * 0.4));
    const sz = base * f * f * (k >= NB ? 1.5 : 1);
    ctx.fillRect(X - sz / 2, Y - sz / 2, sz, sz);
  }
  // progress along the page, and a little lean on the text when scrolling fast
  const tot = document.documentElement.scrollHeight - innerHeight;
  document.querySelector('.prog i').style.width = (tot > 0 ? scrollY / tot * 100 : 0) + '%';
  if (!reduced) document.querySelector('main').style.transform = `skewY(${Math.max(-2.5, Math.min(2.5, vel * 0.04)).toFixed(2)}deg)`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }), { threshold: 0.15 });
secs.forEach(s => io.observe(s));

/* picker: the points become that product, the page goes there, and the demo form is filled in */
pick.addEventListener('click', e => { const b = e.target.closest('button[data-go]'); if (!b) return;
  pick.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  const id = b.dataset.go, prod = PICKS.find(p => p[1] === id)[2];
  showShape(shapes[FORM[id]], 1.4); blip(523, 0.08); blip(784, 0.12);
  document.getElementById('d-product').value = prod;
  setTimeout(() => document.getElementById(id).scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' }), 700);
  toast(prod + ' it is. Your demo form is ready.'); });

/* your name in points, from the hero box or the form's business field */
let nameT = 0;
function spell(v) { clearTimeout(nameT); v = v.trim().slice(0, 22);
  if (!v) { release(); return; } nameT = setTimeout(() => { showShape(textShape(v), 0); blip(660, 0.05, 'triangle', 0.04); }, 180); }
const yn = document.getElementById('your-name');
yn.addEventListener('input', () => { spell(yn.value); const fb = document.getElementById('d-business'); if (fb && !fb.dataset.touched) fb.value = yn.value; });
yn.addEventListener('blur', () => setTimeout(release, 2500));
const fbiz = document.getElementById('d-business');
fbiz.addEventListener('input', () => { fbiz.dataset.touched = 1; spell(fbiz.value); }); fbiz.addEventListener('blur', () => setTimeout(release, 1500));

/* type "bula" anywhere (not in a box) */
let typed = '';
addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,textarea,select')) return; typed = (typed + (e.key || '')).slice(-4).toLowerCase();
  if (typed === 'bula') { showShape(textShape('Bula!'), 2.6); burst = 0.4; blip(392, 0.1); blip(523, 0.12); blip(659, 0.16); toast('Bula vinaka 👋'); typed = ''; } });

/* ── demo form ── */
const fm = document.getElementById('demo-form'), note = document.getElementById('demo-note'), btn = fm.querySelector('button');
document.querySelectorAll('[data-product]').forEach(a => a.addEventListener('click', () => { document.getElementById('d-product').value = a.dataset.product; }));
fm.addEventListener('submit', async e => {
  e.preventDefault(); btn.disabled = true; btn.textContent = 'Sending'; note.hidden = true;
  const data = Object.fromEntries(new FormData(fm)); let problem = '';
  try { const r = await fetch('api/demo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); problem = (r.status === 400 || r.status === 429) && j.error ? j.error : 'We could not send your request. Please email kaitechfj@gmail.com or call +679 756 9670 instead.'; } }
  catch (x) { problem = 'We could not send your request. Please email kaitechfj@gmail.com or call +679 756 9670 instead.'; }
  note.hidden = false; note.className = 'note ' + (problem ? 'err' : 'ok');
  note.textContent = problem || 'Thank you. We have your request and will reply to ' + data.email + '.';
  if (!problem) { burst = 1; blip(660, 0.12); blip(990, 0.16); fm.reset(); }
  btn.disabled = false; btn.textContent = 'Send request';
});
})();

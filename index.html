<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kaitech</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Michroma&display=swap">
<style>
/* Layout: one fixed frame, no scroll. A single object made of points holds the centre and re-forms for each part of the site; everything else sits on the frame's edges like instrument markings. */
:root{
  --bg0:#040507; --bg1:#10141A; --fg:#EEF0F3; --dim:#7F8894; --line:#2A3038;
  --cool:#8FCBFF; --warm:#FFC48A;
  --display:'Michroma','Eurostile','Arial Black',sans-serif;
  --text:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg0);color:var(--fg);font-family:var(--text);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
.k{position:relative;height:100%;min-height:520px;overflow:hidden;
  background:radial-gradient(120% 90% at 62% 42%,var(--bg1) 0%,var(--bg0) 62%);
  padding-block:22px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;gap:16px 24px}
#fx{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#fx:active{cursor:grabbing}
.k>*:not(#fx){position:relative;pointer-events:none}
.k a,.k button{pointer-events:auto}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:1px solid var(--fg);outline-offset:4px}

.mark{grid-column:1/3;grid-row:1;font:400 14px/1 var(--display);letter-spacing:.42em;align-self:start;justify-self:start}
.read{grid-column:3;grid-row:1;display:grid;grid-template-columns:auto auto;gap:4px 14px;font:400 11px/1.2 var(--mono);color:var(--dim);
  font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.06em;text-align:right;justify-self:end}
.read b{font-weight:400;color:var(--fg)}

.idx{grid-column:1;grid-row:2;align-self:center;display:flex;flex-direction:column;gap:2px;font:400 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em}
.idx a{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--dim);transition:color .3s}
.idx a::before{content:"";width:14px;height:1px;background:currentColor;transition:width .45s cubic-bezier(.2,.7,.1,1)}
.idx a:hover{color:var(--fg)}
.idx a[aria-current="true"]{color:var(--fg)}
.idx a[aria-current="true"]::before{width:44px}
.idx kbd{font:inherit;color:var(--dim)}

.panel{grid-column:1/3;grid-row:3;align-self:end;max-width:34rem;display:flex;flex-direction:column;gap:14px;transition:opacity .35s,transform .5s cubic-bezier(.2,.7,.1,1)}
.panel.out{opacity:0;transform:translateY(10px)}
.tag{margin:0;font:400 11px/1 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.14em}
.panel h1{margin:0;font:400 clamp(30px,5.6vw,84px)/1 var(--display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.panel p.body{margin:0;max-width:30rem;font-size:clamp(15px,1.25vw,18px);color:var(--dim);text-wrap:pretty}
.slots{list-style:none;margin:4px 0 0;padding:0;border-top:1px solid var(--line);font:400 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em}
.slots li{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.slots span:last-child{color:var(--dim)}

.hint{grid-column:3;grid-row:3;align-self:end;justify-self:end;text-align:right;font:400 11px/1.6 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.hint b{display:block;font:400 clamp(22px,2.6vw,36px)/1 var(--display);color:var(--fg);letter-spacing:.04em;margin-bottom:10px;font-variant-numeric:tabular-nums}
.hint b i{font-style:normal;color:var(--dim)}

@media (max-width:720px){
  .k{grid-template-columns:minmax(0,1fr) auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mark{grid-column:1} .read{grid-column:2}
  .read .wide{display:none}
  .idx{grid-column:1/3;grid-row:3;flex-direction:row;gap:0;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px}
  .idx a{padding:12px 0;gap:8px} .idx a::before{width:0} .idx a[aria-current="true"]::before{width:14px} .idx kbd{display:none}
  .panel{grid-column:1/3;grid-row:2}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="k">
  <canvas id="fx" aria-hidden="true"></canvas>

  <a class="mark" href="#home">KAITECH</a>

  <div class="read" aria-hidden="true">
    <span>Yaw</span><b id="r-yaw">+000.0°</b>
    <span>Pitch</span><b id="r-pit">+000.0°</b>
    <span class="wide">Points</span><b class="wide" id="r-pts">0</b>
    <span class="wide">Local</span><b class="wide" id="r-time">00:00:00</b>
  </div>

  <nav class="idx" aria-label="Sections">
    <a href="#home"><kbd>1</kbd>Kaitech</a>
    <a href="#work"><kbd>2</kbd>Work</a>
    <a href="#about"><kbd>3</kbd>About</a>
    <a href="#contact"><kbd>4</kbd>Contact</a>
  </nav>

  <section class="panel" id="panel" aria-live="polite">
    <p class="tag" id="p-tag"></p>
    <h1 id="p-title"></h1>
    <p class="body" id="p-body"></p>
    <ul class="slots" id="p-slots" hidden></ul>
  </section>

  <div class="hint" aria-hidden="true">
    <b><span id="h-n">01</span><i> / 04</i></b>
    Drag to turn<br>Scroll or ↑ ↓ to move on
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = $('fx'), ctx = cv.getContext('2d');
const N = Math.min(innerWidth, innerHeight) < 600 ? 4200 : 8000;

const MODES = [
  { id: 'home', tag: 'Form 01 · the name', title: 'Kaitech',
    body: 'A new name in technology. Turn the object, then move through the site and watch it re-form.' },
  { id: 'work', tag: 'Form 02 · structure', title: 'Work',
    body: 'Each project gets this frame to itself, one at a time, with a form of its own.',
    slots: [['Slot 01', 'Open'], ['Slot 02', 'Open'], ['Slot 03', 'Open']] },
  { id: 'about', tag: 'Form 03 · whole', title: 'About',
    body: 'One name and one standard: nothing leaves until it is right.' },
  { id: 'contact', tag: 'Form 04 · loop', title: 'Contact',
    body: 'Start a conversation.',
    slots: [['Email', 'To be added'], ['Based', 'To be added']] },
];

/* ── shapes: every form is the same N points, rearranged ── */
const rnd = (a = 1) => (Math.random() - 0.5) * 2 * a;
function shapeText(str) {
  const W = 720, H = 240, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.font = `400 170px Michroma, "Arial Black", Impact, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  let size = 170, tw = g.measureText(str).width; if (tw > W - 40) { size *= (W - 40) / tw; g.font = `400 ${size}px Michroma, "Arial Black", Impact, sans-serif`; tw = W - 40; }
  const k = 3.4 / (tw || W);
  g.fillStyle = g.strokeStyle = '#fff'; g.lineWidth = 5; g.lineJoin = 'round';
  g.fillText(str, W / 2, H / 2); g.strokeText(str, W / 2, H / 2);
  const d = g.getImageData(0, 0, W, H).data, px = [];
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (d[(y * W + x) * 4 + 3] > 128) px.push(x, y);
  const out = new Float32Array(N * 3), n = px.length / 2 || 1;
  for (let i = 0; i < N; i++) {
    const j = (Math.random() * n | 0) * 2;
    out[i * 3] = ((px[j] || W / 2) + rnd(1) - W / 2) * k;
    out[i * 3 + 1] = ((px[j + 1] || H / 2) + rnd(1) - H / 2) * k;
    out[i * 3 + 2] = rnd(0.16);
  }
  return out;
}
function shapeLattice() {
  const out = new Float32Array(N * 3), node = () => (Math.random() * 4 | 0) / 1.5 - 1;
  for (let i = 0; i < N; i++) {
    const p = [node(), node(), node()]; p[Math.random() * 3 | 0] = rnd(1);
    out[i * 3] = p[0] * 0.82 + rnd(0.006); out[i * 3 + 1] = p[1] * 0.82 + rnd(0.006); out[i * 3 + 2] = p[2] * 0.82 + rnd(0.006);
  }
  return out;
}
function shapeSphere() {
  const out = new Float32Array(N * 3), ring = N * 0.16 | 0, n = N - ring;
  for (let i = 0; i < n; i++) {
    const y = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - y * y), a = i * 2.39996323;
    out[i * 3] = Math.cos(a) * r * 1.08; out[i * 3 + 1] = y * 1.08; out[i * 3 + 2] = Math.sin(a) * r * 1.08;
  }
  for (let i = n; i < N; i++) {
    const a = Math.random() * 6.2832, r = 1.5 + rnd(0.07), x = Math.cos(a) * r, z = Math.sin(a) * r;
    out[i * 3] = x; out[i * 3 + 1] = x * 0.32 + rnd(0.012); out[i * 3 + 2] = z;
  }
  return out;
}
function shapeKnot() {
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const t = Math.random() * 6.2832, r = 2 + Math.cos(3 * t), j = 0.07;
    out[i * 3] = r * Math.cos(2 * t) * 0.44 + rnd(j); out[i * 3 + 1] = r * Math.sin(2 * t) * 0.44 + rnd(j); out[i * 3 + 2] = Math.sin(3 * t) * 0.62 + rnd(j);
  }
  return out;
}
const shapes = [shapeText('KAI'), shapeLattice(), shapeSphere(), shapeKnot()];

/* points keep one colour for life, set by where they sit in the name: cool on the left, warm on the right */
const pos = new Float32Array(shapes[0]), ease = new Float32Array(N), order = new Uint32Array(N);
const BUCKETS = 9, palette = [], bucket = new Uint8Array(N);
{
  const cs = getComputedStyle(document.documentElement), hex = n => { const h = cs.getPropertyValue(n).trim().slice(1); return [0, 2, 4].map(k => parseInt(h.substr(k, 2), 16)); };
  const a = hex('--cool'), w = [244, 246, 250], b = hex('--warm');
  for (let k = 0; k < BUCKETS; k++) {
    const t = k / (BUCKETS - 1), u = t < 0.5 ? t * 2 : (t - 0.5) * 2, p = t < 0.5 ? a : w, q = t < 0.5 ? w : b;
    palette.push(`rgb(${p.map((v, j) => Math.round(v + (q[j] - v) * u)).join(',')})`);
  }
}
function colourise() {
  for (let i = 0; i < N; i++) {
    const t = Math.min(0.999, Math.max(0, shapes[0][i * 3] / 3.4 + 0.5 + rnd(0.07)));
    bucket[i] = t * BUCKETS | 0; ease[i] = 0.035 + Math.random() * 0.075; order[i] = i;
  }
  order.sort((p, q) => bucket[p] - bucket[q]);
}
colourise();
if (document.fonts && document.fonts.load) document.fonts.load('170px Michroma').then(() => {
  shapes[0] = shapeText('KAI'); colourise(); if (reduced && mode === 0) pos.set(shapes[0]);
}).catch(() => {});

/* ── view ── */
let W = 0, H = 0, dpr = 1, mode = 0, yaw = 0, pitch = 0, uy = 0, up = 0, vy = 0, vp = 0, px = 0, py = 0, spin = 0, drag = null;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
}
new ResizeObserver(resize).observe(cv); resize();

function frame(now) {
  const t = now / 1000, target = shapes[mode], narrow = W < 720;
  if (!drag) { uy += vy; up += vp; vy *= 0.94; vp *= 0.94; uy *= 0.985; up *= 0.97; }
  if (!reduced) spin += mode === 0 ? 0 : 0.0032;
  const sway = reduced ? 0 : mode === 0 ? Math.sin(t * 0.42) * 0.38 : 0;
  if (mode === 0) spin *= 0.94;
  const ty = uy + spin + sway + px * 0.3, tp = Math.max(-1.1, Math.min(1.1, up + py * 0.22 + (mode === 0 ? 0 : 0.28)));
  yaw += (ty - yaw) * 0.12; pitch += (tp - pitch) * 0.12;
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const cx = W * (narrow ? 0.5 : 0.6), cyy = H * (narrow ? 0.34 : 0.46);
  const scale = Math.min(W / (narrow ? 4.1 : 5.2), H / (narrow ? 5.2 : 3.6)) * dpr, base = dpr * (narrow ? 1.25 : 1.45);

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.globalCompositeOperation = 'lighter';
  let last = -1;
  for (let o = 0; o < N; o++) {
    const i = order[o], j = i * 3, e = reduced ? 1 : ease[i];
    const x = pos[j] += (target[j] - pos[j]) * e, y = pos[j + 1] += (target[j + 1] - pos[j + 1]) * e, z = pos[j + 2] += (target[j + 2] - pos[j + 2]) * e;
    const x1 = x * cy + z * sy, z1 = -x * sy + z * cy, y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
    const f = 4 / (4 + z2); if (f <= 0) continue;
    if (bucket[i] !== last) { last = bucket[i]; ctx.fillStyle = palette[last]; }
    ctx.globalAlpha = Math.max(0.12, Math.min(1, 0.62 - z2 * 0.42));
    const s = base * f * f;
    ctx.fillRect(cx * dpr + x1 * scale * f - s / 2, cyy * dpr + y1 * scale * f - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  if ((now / 100 | 0) !== readTick) { readTick = now / 100 | 0; readout(); }
  requestAnimationFrame(frame);
}
let readTick = 0;
const deg = r => { let d = ((r * 57.2958 + 180) % 360 + 360) % 360 - 180; return (d < 0 ? '−' : '+') + Math.abs(d).toFixed(1).padStart(5, '0') + '°'; };
function readout() {
  $('r-yaw').textContent = deg(yaw); $('r-pit').textContent = deg(pitch);
  $('r-time').textContent = new Date().toTimeString().slice(0, 8);
}
$('r-pts').textContent = N.toLocaleString('en-US');

/* ── input ── */
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; vy = vp = 0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  px = e.clientX / W - 0.5; py = e.clientY / H - 0.5;
  if (!drag) return;
  vy = (e.clientX - drag.x) * 0.006; vp = (e.clientY - drag.y) * 0.006; uy += vy; up += vp; drag.x = e.clientX; drag.y = e.clientY;
});
const end = () => { drag = null; };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { px = e.clientX / innerWidth - 0.5; py = e.clientY / innerHeight - 0.5; } }, { passive: true });

/* ── sections ── */
const panel = $('panel'), links = [...document.querySelectorAll('.idx a')];
let swap = 0;
function fill() {
  const m = MODES[mode];
  $('p-tag').textContent = m.tag; $('p-title').textContent = m.title; $('p-body').textContent = m.body;
  const ul = $('p-slots'); ul.hidden = !m.slots; ul.textContent = '';
  (m.slots || []).forEach(([a, b]) => { const li = document.createElement('li'); li.innerHTML = '<span></span><span></span>'; li.children[0].textContent = a; li.children[1].textContent = b; ul.appendChild(li); });
  $('h-n').textContent = '0' + (mode + 1);
  links.forEach((a, i) => a.setAttribute('aria-current', i === mode));
}
function go(i, instant) {
  i = Math.max(0, Math.min(MODES.length - 1, i)); if (i === mode && !instant) return;
  mode = i; clearTimeout(swap);
  if (instant || reduced) { fill(); panel.classList.remove('out'); }
  else { panel.classList.add('out'); swap = setTimeout(() => { fill(); panel.classList.remove('out'); }, 320); }
  if (location.hash.slice(1) !== MODES[i].id) try { history.replaceState(null, '', '#' + MODES[i].id); } catch (e) { location.hash = MODES[i].id; }
}
const fromHash = () => Math.max(0, MODES.findIndex(m => m.id === location.hash.slice(1)));
addEventListener('hashchange', () => go(fromHash()));
links.forEach((a, i) => a.addEventListener('click', e => { e.preventDefault(); go(i); }));
document.querySelector('.mark').addEventListener('click', e => { e.preventDefault(); go(0); });
let cool = 0;
addEventListener('wheel', e => {
  const now = performance.now(); if (Math.abs(e.deltaY) < 12 || now < cool) return;
  cool = now + 750; go(mode + (e.deltaY > 0 ? 1 : -1));
}, { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'PageDown') go(mode + 1);
  else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'PageUp') go(mode - 1);
  else if (e.key >= '1' && e.key <= '4') go(+e.key - 1);
});
mode = fromHash(); if (mode) pos.set(shapes[mode]);
go(mode, true); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
